<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "张雨生答案之书",
  "url": "https://yusheng.onlymanes.ai/",
  "inLanguage": "zh-CN",
  "description": "宝友写下问题，掷一枚六面骰子，宝哥用张雨生自己的歌词与文字作答。答案出自张雨生本人演唱作品的歌词与亲笔文字。",
  "keywords": ["张雨生", "答案之书", "宝友"],
  "author": {"@type": "Organization", "name": "onlymanes", "url": "https://onlymanes.ai/"},

}

<body>
<header class="site-header">
  <img class="logo" src="avatar.webp" alt="张雨生手绘头像">
  <div class="site-title">
    <h1 id="siteTitle">张雨生答案之书</h1>
    <p class="subtitle" id="siteSubtitle">写下你的问题，掷骰子，听宝哥回答</p>
  </div>
  <button type="button" id="langBtn" class="lang-btn" title="切换繁体 / 简体">繁體</button>
</header>

<main>
  <section class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <img class="hero-avatar" src="avatar.webp" alt="张雨生手绘头像">
    <p class="hero-line" id="heroLine">“倘若源自心灵，不过诚实而已。”</p>
    <p class="hero-note" id="heroNote">——宝哥</p>
  </section>

  <section class="choice" id="choiceSection">
    <p class="choice-label" id="choiceLabel">先选答案库：</p>
    <div class="choice-btns">
      <button type="button" id="mode100Btn" class="btn choice active">100个答案</button>
      <button type="button" id="mode548Btn" class="btn choice">548个答案</button>
    </div>
    <p class="choice-note" id="choiceNote">100条经典歌词</p>
  </section>

  <section class="ask" id="askSection">
    <label for="question" id="askLabel">你的问题</label>
    <textarea id="question" rows="2" maxlength="200" placeholder="宝友，你想问什么？比如：我该怎么办，喜欢他，却不敢说"></textarea>
    <p class="hint" id="questionHint" hidden>先写下你的问题，再掷骰子。</p>
    <button id="rollBtn" class="btn primary">掷骰子</button>
  </section>

  <section class="dice-area" id="diceArea" hidden>
    <div class="die-wrap">
      <div class="die" id="die" aria-label="六面骰子">
        <span class="pip" data-cell="0"></span><span class="pip" data-cell="1"></span><span class="pip" data-cell="2"></span>
        <span class="pip" data-cell="3"></span><span class="pip" data-cell="4"></span><span class="pip" data-cell="5"></span>
        <span class="pip" data-cell="6"></span><span class="pip" data-cell="7"></span><span class="pip" data-cell="8"></span>
      </div>
    </div>
    <p class="dice-status" id="diceStatus">骰子在转……想好了就点停。</p>
    <button id="stopBtn" class="btn primary">停</button>
    <p class="number-line" id="numberLine" hidden>第<span id="answerNumber">–</span><span id="numberUnit">号</span></p>
  </section>

  <section class="answer" id="answerSection" hidden>
    <img class="answer-avatar" src="avatar.webp" alt="宝哥">
    <div class="qa">
      <p class="q"><span class="who" id="whoQ">宝友问：</span><span id="askedQuestion"></span></p>
      <p class="a"><span class="who" id="whoA">宝哥答：</span><span id="answerText"></span></p>
      <p class="source" id="answerSource"></p>
    </div>
    <button id="againBtn" class="btn ghost">再问一次</button>
  </section>
</main>

<footer>
  <p id="footer1">这里是宝友的答案之书：写下你的问题，掷一枚骰子，听宝哥用张雨生自己的话作答。</p>
  <p id="footer2">答案库两种选择：100条经典歌词，或548条（歌词492条 + 雨生亲笔文字56条）</p>
  <p><span id="footer3Text">雨生亲笔文字已收入548答案版</span> · <a href="https://onlymanes.ai/">onlymanes.ai</a></p>
  <p id="footer4">整部作品由宝友Ellen提议，宝友群集思广益，Muse AI生成。</p>
  <p id="footer5">头像：宝友「哈哈」手绘作品。</p>
</footer>

<script src="app.js"></script>
</body>
</html>
